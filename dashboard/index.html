<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BSG Command</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9; --bg2:#eef1f7; --panel:#ffffff; --line:#e1e6ef; --ink:#0e1829; --mute:#5a6a82;
  --gold:#b7862b; --teal:#0e8a8a; --red:#d1453b; --amber:#c98a12; --green:#1f9d63; --blue:#2f6bdc; --violet:#7c4dde;
  --top:#d1453b; --med:#c98a12; --low:#7a8699;
  --shadow:0 1px 2px rgba(14,24,41,.05),0 10px 28px rgba(14,24,41,.07);
  --glass:rgba(255,255,255,.72);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#060b15; --bg2:#0a1220; --panel:#0e1829; --line:#1c2940; --ink:#e8eef8; --mute:#8b9ab3;
  --gold:#e4b357; --teal:#35c2c2; --red:#ff6b5e; --amber:#f0b341; --green:#3ad08a; --blue:#6b9bff; --violet:#a78bfa;
  --top:#ff6b5e; --med:#f0b341; --low:#8b9ab3; --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
  --glass:rgba(10,18,32,.72);
}}
:root[data-theme="dark"]{
  --bg:#060b15; --bg2:#0a1220; --panel:#0e1829; --line:#1c2940; --ink:#e8eef8; --mute:#8b9ab3;
  --gold:#e4b357; --teal:#35c2c2; --red:#ff6b5e; --amber:#f0b341; --green:#3ad08a; --blue:#6b9bff; --violet:#a78bfa;
  --top:#ff6b5e; --med:#f0b341; --low:#8b9ab3; --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
  --glass:rgba(10,18,32,.72);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(900px 520px at 88% -8%, color-mix(in srgb,var(--gold) 16%,transparent), transparent 60%),
  radial-gradient(760px 520px at -8% 6%, color-mix(in srgb,var(--teal) 14%,transparent), transparent 60%),
  radial-gradient(700px 480px at 50% 110%, color-mix(in srgb,var(--violet) 9%,transparent), transparent 60%);}
.wrap{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding:0 16px 72px}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em;margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .45s ease both}
.settled .rise{animation:none}
@media (prefers-reduced-motion:reduce){.rise{animation:none}}

/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:16px;position:relative;z-index:1}
.lockcard{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px 28px;box-shadow:var(--shadow);text-align:center}
.mark{width:52px;height:52px;border-radius:15px;margin:0 auto 16px;display:grid;place-items:center;font:700 21px "Space Grotesk";color:#0b1424;background:linear-gradient(135deg,var(--gold),#f3d48a);box-shadow:0 6px 18px color-mix(in srgb,var(--gold) 40%,transparent)}
.lockcard h1{font-size:22px}
.lockcard p{color:var(--mute);margin:6px 0 20px;font-size:14px}
.lockcard input[type=password]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font:600 16px/1 "Space Grotesk",monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase}
.lockcard input:focus{outline:2px solid var(--gold);outline-offset:1px}
.lockcard button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
.lockcard .err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}
.lockcard label{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mute);font-size:13px;margin-top:12px}

/* header */
#app{display:none}
header.top{position:sticky;top:0;z-index:20;margin:0 -16px 20px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .mark{margin:0;width:40px;height:40px;font-size:17px;border-radius:12px}
.brand{min-width:0}
.brand h1{font-size:18px;line-height:1.2}
.brand .sub{color:var(--mute);font-size:12px}
.search{flex:1;min-width:160px;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;padding:9px 34px 9px 34px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px}
.search input:focus{outline:2px solid color-mix(in srgb,var(--gold) 70%,transparent);outline-offset:1px}
.search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-52%);color:var(--mute);font-size:17px;pointer-events:none}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:600 11px Inter;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg2);pointer-events:none}
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--mute)}
.iconbtn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.me{font-size:12.5px;color:var(--mute);white-space:nowrap}
.me b{color:var(--ink)}
.hdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:18px}
.greet{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 20%,var(--panel)),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--gold) 32%,var(--line));border-radius:20px;padding:22px 24px;box-shadow:var(--shadow);display:flex;gap:20px;align-items:center}
.greet h2{font-size:26px;line-height:1.15}
.greet .lead{color:var(--mute);margin-top:6px;font-size:14.5px;max-width:46ch}
.greet .lead b{color:var(--ink)}
.ringbox{position:relative;flex:none;width:112px;height:112px}
.ringbox svg{width:112px;height:112px;transform:rotate(-90deg)}
.ringbox .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringbox .c b{font:700 26px "Space Grotesk";line-height:1}
.ringbox .c span{display:block;font-size:10.5px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.focus{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.focus h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-family:Inter;font-weight:700}
.frow{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.rank{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px "Space Grotesk";background:var(--bg2);border:1px solid var(--line);color:var(--mute)}
.frow:first-of-type .rank{background:var(--gold);border-color:var(--gold);color:#0b1424}
.frow .what{flex:1;min-width:0}
.frow .what b{display:block;font-weight:600;font-size:14.5px;line-height:1.3}
.frow .what span{color:var(--mute);font-size:12.5px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--kc,var(--line))}
.kpi .n{font:700 30px/1.1 "Space Grotesk";font-variant-numeric:tabular-nums}
.kpi .l{color:var(--mute);font-size:12px;margin-top:4px}
.kpi.alert .n{color:var(--red)}

.plate{background:#f7f7f7;border-radius:12px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);flex:none}
.plate img{display:block;width:100%;height:100%;object-fit:contain}
header.top .plate{height:46px;width:52px}
.lockcard .plate{width:210px;margin:0 auto 18px;border-radius:16px}
.lockcard .plate img{height:auto}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.acts .mini{padding:3px 9px;font-size:12px}
.acts .mini.ok:hover{color:var(--green);border-color:var(--green)}
.pend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:14px;margin-bottom:18px;background:color-mix(in srgb,var(--blue) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line))}
.pend b{font-weight:600}
.pend .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pend .go{border:0;border-radius:9px;background:var(--ink);color:var(--bg);padding:7px 12px;font-weight:600;font-size:13px}
.grid2b{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px}
.ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ins.first{border-top:0}
.ins .sev.ok{background:var(--green)}
.ins .sev.info{background:var(--blue)}
.cd{display:flex;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cd.first{border-top:0}
.cdn{flex:none;width:64px;text-align:center;font:700 26px/1 "Space Grotesk";color:var(--gold)}
.cdn small{display:block;font:600 10.5px Inter;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.cd b{display:block;font-weight:600;line-height:1.3}
.cd span{color:var(--mute);font-size:12.5px}
@media (max-width:1000px){.grid2b{grid-template-columns:1fr}}

.tabs{display:flex;gap:6px;margin:0 0 18px;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%}
.tab{border:0;background:transparent;border-radius:9px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--mute)}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.sh{display:grid;grid-template-columns:26px 36px 84px minmax(0,1fr) 150px 118px;gap:10px;align-items:center;padding:10px 14px}
.sh.head{background:var(--bg2);font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:9px 14px}
.shw{position:relative;overflow:hidden;border-top:1px solid var(--line);touch-action:pan-y}
.shw .sh{background:var(--panel);position:relative;transition:transform .18s,background .2s}
.shw.swon .sh{transition:none}
.shw.src{opacity:.35}
.shw.flash .sh{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--gold) 35%,var(--panel))}100%{background:var(--panel)}}
.shw.ins-before::before,.shw.ins-after::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--gold);z-index:3}
.shw.ins-before::before{top:0}.shw.ins-after::after{bottom:0}
.shw.hot .sh{background:color-mix(in srgb,var(--gold) 20%,var(--panel))}
.swbg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:700;color:#fff}
.swbg .l,.swbg .r{display:none}
.shw.sw-r .swbg{background:var(--green)}.shw.sw-r .swbg .l{display:block}
.shw.sw-l .swbg{background:var(--blue)}.shw.sw-l .swbg .r{display:block}
.shw.sw-go .swbg{filter:brightness(1.12)}
.hd{cursor:grab;color:var(--mute);font-size:18px;line-height:1;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 0;border-radius:6px}
.hd:hover,.hd:focus-visible{color:var(--ink);background:var(--bg2)}
.sh.fin .hd{visibility:hidden}
.sh.fin .tt{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--green)}
.sh .ck{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--bg2);cursor:pointer;display:grid;place-items:center;margin:0 auto}
.sh .ck:checked{background:var(--green);border-color:var(--green)}
.sh .ck:checked::after{content:"✓";color:#fff;font-size:14px;font-weight:700;line-height:1}
.sh .ck:disabled{opacity:.6;cursor:default}
.sh .pr{font:700 12px Inter,sans-serif;border:0;cursor:pointer;border-radius:6px;padding:3px 8px;text-align:center;color:#fff;background:var(--pc)}
.sh .pr:disabled{opacity:.6;cursor:default}
.sh .tt{font-weight:600;cursor:pointer;line-height:1.35}
.sh .tn{color:var(--mute);font-size:13px;margin-top:3px;font-weight:400}
.sh .ow{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.dwrap{position:relative;display:flex;align-items:center;gap:6px}
.dd2btn{border:0;background:transparent;padding:2px 0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.dd2btn:hover .dd2{text-decoration:underline}
.dpick{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
.sh .dd2{font-size:13px;font-weight:600}
.sh .dd2.late{color:var(--red)} .sh .dd2.today{color:var(--amber)} .sh .dd2.none{color:var(--mute);font-weight:400}
.sh .x{border:0;background:transparent;color:var(--mute);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}
.sh .x:hover{color:var(--red);background:var(--bg2)}
.grp{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg2);border-top:1px solid var(--line);font:700 12px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.grp .dot{width:10px;height:10px;border-radius:50%}
.grp .cnt{color:var(--mute);font-weight:600}
.grp.hot,.grp-empty.hot{background:color-mix(in srgb,var(--gold) 22%,var(--panel))}
.grp-empty{padding:14px;text-align:center;color:var(--mute);font-size:13px;border-top:1px dashed var(--line);border-radius:0}
.tray{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.tray .lbl{font-size:12.5px;color:var(--mute);margin-right:2px}
.tchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font:600 12.5px Inter,sans-serif;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:inline-flex;gap:6px;align-items:center;box-shadow:var(--shadow)}
.tchip i{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--gold));display:inline-block}
.tchip:hover{border-color:var(--gold)}
.pbar{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:13px;color:var(--mute)}
.pbar .bar2{flex:1;height:8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.pbar .bar2 span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:99px;transition:width .4s}
.pbar b{color:var(--ink)}
.addrow{padding:10px 14px;border-top:1px solid var(--line);background:var(--panel)}
.addrow input{width:100%;padding:9px 12px;border-radius:10px;border:1px dashed var(--line);background:var(--bg2);color:var(--ink);font:inherit;font-size:14px}
.addrow input:focus{outline:2px solid var(--gold);outline-offset:1px;border-style:solid}
.ghost{position:fixed;z-index:999;pointer-events:none;padding:8px 14px;border-radius:10px;background:var(--panel);color:var(--ink);border:1px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.28);font-weight:600;font-size:14px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translate(-50%,-130%)}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:1000;background:#1d2733;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .2s,transform .2s;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:transparent;color:#f3d48a;font:700 14px Inter,sans-serif;cursor:pointer;padding:2px 4px}
.cf{position:fixed;z-index:1001;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:cf .8s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.shw .sh,.pbar .bar2 span{transition:none}.shw.flash .sh{animation:none}}
.recs{background:var(--panel);border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:22px}
.recs h2{font-size:16px;margin-bottom:6px}
.recs ol{margin:0;padding-left:20px}
.recs li{padding:5px 0;font-size:14.5px;line-height:1.45}
.recs li span{color:var(--mute);font-size:13px}
@media (max-width:700px){
  .sh{grid-template-columns:28px 34px minmax(0,1fr) auto;grid-template-areas:"hd ck tt pr" "hd ck ow dd";row-gap:4px;padding:10px 10px}
  .sh.head{display:none}
  .sh > :nth-child(1){grid-area:hd}.sh > :nth-child(2){grid-area:ck}.sh > :nth-child(3){grid-area:pr}.sh > :nth-child(4){grid-area:tt}.sh > :nth-child(5){grid-area:ow}.sh > :nth-child(6){grid-area:dd;justify-self:end}
  .hd{font-size:22px;padding:10px 0}
}

/* section bars */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.bar h2{font-size:18px;margin-right:auto}
.bar .hint{color:var(--mute);font-size:12.5px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mute)}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:12px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 6px;text-align:center;box-shadow:var(--shadow)}
.day:hover{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.day .dw{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.day .dd{font:700 18px "Space Grotesk";margin:1px 0}
.day .dc{font-size:11.5px;color:var(--mute);min-height:16px}
.day .dc b{color:var(--ink)}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day.on .dw,.day.on .dc,.day.on .dc b{color:var(--bg)}
.day.is-today:not(.on){border-color:var(--gold)}
.day.has .dd{color:var(--gold)}
.day.on.has .dd{color:var(--bg)}

.today{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px;margin-bottom:26px;box-shadow:var(--shadow)}
.trow{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px}
.trow+.trow{border-top:1px solid var(--line)}
.trow .what{flex:1;min-width:0}
.trow .what b{font-weight:600}
.trow .what span{color:var(--mute);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mute);padding:14px;font-size:14px}

/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:26px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);position:relative}
.gcard.local{border-style:dashed}
.gtop{display:flex;gap:14px;align-items:flex-start}
.gtop .ringbox{width:64px;height:64px}
.gtop .ringbox svg{width:64px;height:64px}
.gtop .ringbox .c b{font-size:15px}
.gtop h3{font-size:16px;line-height:1.3}
.gtop p{margin:4px 0 0;color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:1px 7px;margin-bottom:5px;border:1px solid var(--line);color:var(--mute)}
.tag.shared{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.ms{list-style:none;margin:12px 0 0;padding:0}
.ms li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.ms li:first-child{border-top:0}
.ms input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:19px;height:19px;border-radius:6px;border:2px solid var(--line);background:var(--bg2);margin:1px 0 0;cursor:pointer;display:grid;place-items:center}
.ms input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
.ms input[type=checkbox]:checked::after{content:"✓";color:#fff;font-size:12px;font-weight:700;line-height:1}
.ms li.d span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--green)}
.ms .x{margin-left:auto;border:0;background:none;color:var(--mute);font-size:15px;padding:0 4px;opacity:.55}
.ms .x:hover{opacity:1;color:var(--red)}
.numrow{display:flex;gap:8px;align-items:center;margin-top:12px}
.numrow input[type=range]{flex:1;accent-color:var(--gold)}
.numrow b{font:700 14px "Space Grotesk";min-width:70px;text-align:right}
.gfoot{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:4px 10px;font-size:12.5px;color:var(--mute)}
.mini:hover{color:var(--ink)}
.mini.del:hover{color:var(--red);border-color:var(--red)}
.addbox{border:2px dashed var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;justify-content:center;background:transparent}
.addbox h3{font-size:15px}
.addbox input[type=text],.addbox input[type=number]{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px}
.addbox .row{display:flex;gap:8px}
.addbox .go{border:0;border-radius:10px;background:var(--ink);color:var(--bg);padding:9px 14px;font-weight:600}

/* tasks */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:30px}
.col{background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid var(--line);border-radius:18px;padding:12px}
.colh{display:flex;align-items:center;gap:8px;padding:4px 4px 10px}
.colh .dot{width:10px;height:10px;border-radius:50%}
.colh h3{font-size:15px}
.colh .cnt{margin-left:auto;color:var(--mute);font-size:12px;font-weight:600;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:13px;padding:12px 12px 10px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card h4{margin:0 0 6px;font-size:14.5px;font-weight:600;line-height:1.35}
.card p{margin:6px 0 0;color:var(--mute);font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.prog{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.pill.wait{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.pill.late{color:#fff;background:var(--red);border-color:var(--red)}
.pill.due{color:#0b1424;background:var(--amber);border-color:var(--amber)}
.pill.soon{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 40%,var(--line))}
.who{display:inline-flex;margin-left:auto}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px Inter;color:#fff;border:2px solid var(--panel);margin-left:-6px}
.av:first-child{margin-left:0}

/* panels */
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:26px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.panel h2{font-size:17px;margin-bottom:12px}
.funnel{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fs{flex:1;min-width:84px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--bg2)}
.fs b{font:700 18px "Space Grotesk";display:block;line-height:1.1}
.fs span{font-size:11px;color:var(--mute)}
.fs.z{opacity:.55}
.client{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.client.first{border-top:0}
.ini{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:700 14px "Space Grotesk";background:var(--bg2);border:1px solid var(--line)}
.client .nm{font-weight:600}
.client .nx{color:var(--mute);font-size:13px}
.client .rt{text-align:right;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.stage{font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--bg2);border:1px solid var(--line)}
.health .hi{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.health .hi.first{border-top:0}
.sev{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px}
.sev.fail{background:var(--red);box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 20%,transparent)}
.sev.warn{background:var(--amber)}
.stamp{font-size:12.5px;color:var(--mute);margin-bottom:8px}
.stamp.stale{color:var(--red);font-weight:600}
.stand{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.st{border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:var(--bg2)}
.st .n{font:700 22px "Space Grotesk"}
.st .l{font-size:12.5px;font-weight:600}
.st .x{font-size:11.5px;color:var(--mute)}
.done{columns:2;column-gap:24px}
.done div{break-inside:avoid;padding:6px 0;color:var(--mute);text-decoration:line-through;text-decoration-color:var(--green);font-size:14px}
.done div::before{content:"✓ ";color:var(--green);text-decoration:none;display:inline-block;margin-right:4px}
footer{color:var(--mute);font-size:12.5px;margin-top:28px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--mute)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.done{columns:1}
  .client{grid-template-columns:auto 1fr}.client .rt{grid-column:2;align-items:flex-start;flex-direction:row}
  .greet{flex-direction:column;align-items:flex-start}.greet h2{font-size:22px}
  .goals{grid-template-columns:1fr}.me{display:none}.search kbd{display:none}
  .day .dc{font-size:10.5px}
}
</style>
</head>

const OWNER_COLORS = {Alex:'#2f6bdc', Carlos:'#8b5cf6', Jesse:'#a16207', Jose:'#db2777'};
const PCOL = {Top:'var(--top)', Medium:'var(--med)', Low:'var(--low)'};

const dec = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function unlock(code){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.trim().toUpperCase()), 'PBKDF2', false, ['deriveKey']);
  for (const k of RAW.keys){
    try{
      const wk = await crypto.subtle.deriveKey({name:'PBKDF2', salt:dec(k.salt), iterations:RAW.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const blob = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:dec(k.iv)}, wk, dec(k.ct))));
      const mk = await crypto.subtle.importKey('raw', dec(blob.mk), 'AES-GCM', false, ['decrypt']);
      const data = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:dec(RAW.iv)}, mk, dec(RAW.ct))));
      return {data, name: blob.name};
    }catch(e){}
  }
  return null;
}

/* dates, America/New_York */
function todayNY(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function addDays(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dayDiff(iso, today){ return Math.round((Date.parse(iso+'T12:00:00Z') - Date.parse(today+'T12:00:00Z'))/864e5); }
function fmtDay(iso){ return new Date(iso+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}); }
function duePill(iso, today){
  if(!iso) return '';
  const d = dayDiff(iso, today);
  if(d < 0) return `<span class="pill late">${-d}d overdue</span>`;
  if(d === 0) return `<span class="pill due">Today</span>`;
  if(d <= 3) return `<span class="pill soon">${d===1?'Tomorrow':fmtDay(iso)}</span>`;
  return `<span class="pill">${fmtDay(iso)}</span>`;
}
function statusPill(s){
  if(s==='In progress') return '<span class="pill prog">In progress</span>';
  if(s==='Waiting on someone') return '<span class="pill wait">Waiting</span>';
  return '';
}
function avatars(list){
  return `<span class="who">${(list||[]).map(o=>`<span class="av" title="${esc(o)}" style="background:${OWNER_COLORS[o]||'#64748b'}">${esc(o[0])}</span>`).join('')}</span>`;
}
function ring(pct, color, big){
  const r=big?46:26, c=2*Math.PI*r, s=big?112:64, w=big?9:7;
  return `<svg viewBox="0 0 ${s} ${s}"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/>
  <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(c*pct/100).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
function hl(text, q){
  const t = esc(text); if(!q) return t;
  const re = new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return t.replace(re,'<mark>$1</mark>');
}

/* goals: shared ones come from the page data; edits made here live on this device only */
const LS = 'bsg_goals_v1';
function blankLocal(){ return {added:[],hidden:[],ms:{},num:{},tdone:{},snooze:{},order:[],prio:{},own:{},newTasks:[]}; }
function loadLocal(){
  const B = blankLocal();
  try{ const j=JSON.parse(localStorage.getItem(LS)||'null');
    if(j&&typeof j==='object'){ const o=Object.assign(B,j);
      ['added','hidden','order','newTasks'].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
      ['ms','num','tdone','snooze','prio','own'].forEach(k=>{ if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k])) o[k]={}; });
      o.newTasks = o.newTasks.filter(n=>n&&typeof n.id==='string'&&typeof n.task==='string'&&n.task.trim());
      return o; } }catch(e){}
  return B; }
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(L)); }catch(e){} }
let L = loadLocal();
function goalList(D){
  const shared = (D.goals||[]).filter(g=>!L.hidden.includes(g.id)).map(g=>({...g, shared:true}));
  return shared.concat(L.added.map(g=>({...g, shared:false})));
}
function goalPct(g){
  if(g.target){ const cur = L.num[g.id] ?? g.current ?? 0; return Math.min(100, Math.round(100*cur/g.target)); }
  const ms = g.milestones||[]; if(!ms.length) return 0;
  const n = ms.filter((m,i)=> (L.ms[g.id+':'+i] ?? m.done)).length;
  return Math.round(100*n/ms.length);
}


function normalize(D){
  const arr = x => Array.isArray(x) ? x : [];
  D.tasks = arr(D.tasks).map(t => Object.assign({task:'(untitled)',priority:'Low',status:'To do',checkup:null,notes:''}, t, {owner:arr(t.owner)}));
  D.clients = arr(D.clients).map(c => Object.assign({name:'?',type:'Lead',stage:'New',next:'',checkup:null,notes:''}, c, {owner:arr(c.owner)}));
  D.standing = arr(D.standing); D.countdowns = arr(D.countdowns); D.goals = arr(D.goals);
  D.health = (D.health && typeof D.health==='object') ? D.health : {};
  D.health.items = arr(D.health.items);
  D.company = D.company || 'Biscayne Solutions Group'; D.goal = D.goal || ''; D.notion = D.notion || '#';

async function copyText(txt, btn, msg){
  const old = btn.textContent;
  try{ await navigator.clipboard.writeText(txt); btn.textContent = msg; }
  catch(e){
    try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); btn.textContent = msg; }
    catch(e2){ btn.textContent = 'Copy failed in this browser'; }
  }
  setTimeout(()=>{ btn.textContent = old; }, 2500);
}

function wire(){
  const $$ = s => document.querySelectorAll(s);
  $$('.chip').forEach(b=>b.onclick=()=>{ STATE.owner=b.dataset.o; renderMain(); });
  $$('.day').forEach(b=>b.onclick=()=>{ STATE.day = b.dataset.day===todayNY()?null:b.dataset.day; renderMain(); });
  $$('[data-ms]').forEach(b=>b.onchange=()=>{ L.ms[b.dataset.ms]=b.checked; saveLocal(); renderMain(); });
  $$('[data-num]').forEach(b=>b.onchange=()=>{ L.num[b.dataset.num]=+b.value; saveLocal(); renderMain(); });
  $$('[data-rmgoal]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.rmgoal;
    if(L.added.some(g=>g.id===id)) L.added = L.added.filter(g=>g.id!==id); else L.hidden.push(id);
    saveLocal(); renderMain();
  });
  $$('[data-rmms]').forEach(b=>b.onclick=()=>{
    const [id,i]=b.dataset.rmms.split(':'); const g=L.added.find(x=>x.id===id); if(!g) return;
    g.milestones.splice(+i,1); saveLocal(); renderMain();
  });
  $$('[data-addms]').forEach(inp=>inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter'||!inp.value.trim()) return; e.preventDefault();
    const g=L.added.find(x=>x.id===inp.dataset.addms); if(!g) return;
    g.milestones.push({t:inp.value.trim().slice(0,120),done:false}); saveLocal(); renderMain();
  }));

  $$('[data-view]').forEach(b=>b.onclick=()=>{ STATE.view=b.dataset.view; try{localStorage.setItem('bsg_view',STATE.view)}catch(e){} renderMain(); window.scrollTo(0,0); });
  $$('[data-exp]').forEach(b=>b.onclick=()=>{ if(Date.now()-SWIPED<500) return; const k=b.dataset.exp; STATE.exp[k]=!STATE.exp[k]; renderMain(); });
  $$('[data-done]').forEach(b=>b.onclick=()=>{ L.tdone[b.dataset.done]=true; saveLocal(); renderMain(); });
  $$('[data-undo]').forEach(b=>b.onclick=()=>{ delete L.tdone[b.dataset.undo]; saveLocal(); renderMain(); });
  $$('[data-snz]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.snz, i=v.lastIndexOf('|'), k=v.slice(0,i), n=+v.slice(i+1), t=todayNY();
    const cur=EFF[k]; const base=(cur && cur>t)?cur:t;
    L.snooze[k]=addDays(base,n); saveLocal(); renderMain();
  });
  const cb=document.getElementById('copybrief'); if(cb) cb.onclick=()=>copyText(BRIEF,cb,'Copied. Paste it anywhere.');
  const cu=document.getElementById('copyupd'); if(cu) cu.onclick=()=>copyText(UPDATES,cu,'Copied. Paste it into the project chat.');
  const cl=document.getElementById('clearloc'); if(cl) cl.onclick=()=>mutate('Cleared your changes',()=>{ L=blankLocal(); });
  const ag = document.getElementById('addgoal');
  if(ag) ag.onsubmit = e=>{
    e.preventDefault();
    const title=document.getElementById('gtitle').value.trim(); if(!title) return;
    const target=parseInt(document.getElementById('gtarget').value,10);
    const g={id:'l'+Date.now().toString(36), title:title.slice(0,120), why:'', due:''};
    if(target>0){ g.target=target; g.current=0; g.unit=document.getElementById('gunit').value.trim(); } else g.milestones=[];
    L.added.push(g); saveLocal(); renderMain();
  };
  const cg = document.getElementById('copygoals');
  if(cg) cg.onclick = async ev=>{
    const txt = 'Add these goals to the shared dashboard:\n'+JSON.stringify({added:L.added, hide:L.hidden},null,1);
    try{ await navigator.clipboard.writeText(txt); ev.target.textContent='Copied. Paste it into the project chat.'; }
    catch(e){ ev.target.textContent='Copy failed in this browser.'; }
  };
}


/* ---- sheet interactions: undo, toast, drag, swipe, quick add ---- */
let UNDO = [], TT = null, DRAG = null, SW = null, SWIPED = 0, RAF = 0;
function toast(msg, canUndo){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent=''; const sp=document.createElement('span'); sp.textContent=msg; el.appendChild(sp);
  if(canUndo!==false && UNDO.length){ const b=document.createElement('button'); b.type='button'; b.textContent='Undo'; b.onclick=undo; el.appendChild(b); }
  el.classList.add('show'); clearTimeout(TT); TT=setTimeout(()=>el.classList.remove('show'),6000);
}
function burst(x,y){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  const cols=['#c9a24b','#2e9e6b','#3b82f6','#e0527a'];
  for(let i=0;i<14;i++){ const d=document.createElement('i'); d.className='cf'; const a=Math.random()*Math.PI*2, r=40+Math.random()*50;
    d.style.cssText='left:'+x+'px;top:'+y+'px;background:'+cols[i%4]+';--dx:'+(Math.cos(a)*r)+'px;--dy:'+(Math.sin(a)*r-30)+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),900); }
}
function mutate(label, fn, pt){
  UNDO.push({s:JSON.stringify(L)}); if(UNDO.length>30) UNDO.shift();
  fn(); saveLocal(); renderMain(); toast(label);
  if(pt) burst(pt.x,pt.y);
}
function undo(){
  const u=UNDO.pop(); if(!u) return;
  try{ L=Object.assign(blankLocal(),JSON.parse(u.s)); }catch(e){ return; }
  saveLocal(); renderMain(); toast('Undone',false);
}
function setPrio(k,p){ if(p===BASEP[k]) delete L.prio[k]; else L.prio[k]=p; }
function addOwner(k,name){ const cur=Array.isArray(L.own[k])?L.own[k]:[]; if(!cur.includes(name)) L.own[k]=cur.concat(name); }
function moveTask(k,prio,before){
  const G={}; ['Top','Medium','Low'].forEach(p=>{ G[p]=SHEET.groups[p].filter(x=>x!==k); });
  const arr=G[prio]; const i=before?arr.indexOf(before):-1; if(i<0) arr.push(k); else arr.splice(i,0,k);
  L.order=G.Top.concat(G.Medium,G.Low); setPrio(k,prio); FLASH=k;
}
const clearMarks = ()=>document.querySelectorAll('.ins-before,.ins-after,.hot,.src').forEach(n=>n.classList.remove('ins-before','ins-after','hot','src'));
function startDrag(e,kind,payload,label,row){
  if(DRAG||(e.button!==undefined && e.button>0)) return;
  e.preventDefault();
  const g=document.createElement('div'); g.className='ghost'; g.textContent=label; g.style.display='none'; document.body.appendChild(g);
  DRAG={kind,payload,g,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false,target:null,row};
  document.body.classList.add('dragging'); if(row) row.classList.add('src');
  const loop=()=>{ if(!DRAG) return; const y=DRAG.y; if(y<70) window.scrollBy(0,-14); else if(y>innerHeight-70) window.scrollBy(0,14); if(DRAG.moved) updateTarget(); RAF=requestAnimationFrame(loop); };
  RAF=requestAnimationFrame(loop);
}
function nextRow(row){ let n=row.nextElementSibling; while(n){ if(n.hasAttribute('data-grp')||n.classList.contains('grp')||n.classList.contains('addrow')) return null; if(n.classList.contains('shw') && n.dataset.k!==(DRAG&&DRAG.payload) && !n.hasAttribute('data-dn')) return n; n=n.nextElementSibling; } return null; }
function updateTarget(){
  if(!DRAG) return;
  const d=DRAG; d.g.style.left=d.x+'px'; d.g.style.top=d.y+'px';
  document.querySelectorAll('.ins-before,.ins-after,.hot').forEach(n=>n.classList.remove('ins-before','ins-after','hot'));
  d.target=null;
  const el=document.elementFromPoint(d.x,d.y); if(!el) return;
  const row=el.closest('.shw[data-k]:not([data-dn])'), grp=el.closest('[data-grp]');
  if(d.kind==='row'){
    if(row && row.dataset.k!==d.payload){
      const r=row.getBoundingClientRect(), after=d.y>r.top+r.height/2, p=row.dataset.p;
      row.classList.add(after?'ins-after':'ins-before');
      let before=row.dataset.k;
      if(after){ const nx=nextRow(row); before = nx ? nx.dataset.k : null; }
      d.target={prio:p,before};
    } else if(!row && grp){
      grp.classList.add('hot'); const p=grp.dataset.grp;
      const first=SHEET.groups[p].filter(x=>x!==d.payload)[0];
      d.target={prio:p,before:grp.classList.contains('grp-empty')?null:(first||null)};
    }
  } else if(row){ row.classList.add('hot'); d.target={key:row.dataset.k}; }
}
function endDrag(){ if(!DRAG) return; cancelAnimationFrame(RAF); DRAG.g.remove(); document.body.classList.remove('dragging'); clearMarks(); DRAG=null; }
function dragMove(e){
  const d=DRAG; d.x=e.clientX; d.y=e.clientY;
  if(!d.moved && Math.hypot(d.x-d.sx,d.y-d.sy)>4){ d.moved=true; d.g.style.display='block'; }
  if(d.moved) updateTarget();
}
function dragDrop(){
  const d=DRAG; if(!d) return; updateTarget(); const t=d.target, moved=d.moved; endDrag(); if(!moved||!t) return;
  if(d.kind==='row'){
    const k=d.payload, same=SHEET.prioOf[k]===t.prio;
    mutate(same?'Reordered':'Moved to '+t.prio, ()=>moveTask(k,t.prio,t.before));
  } else {
    const k=t.key, [type,val]=d.payload.split(/:(.*)/s);
    if(type==='prio'){ if(SHEET.prioOf[k]===val) return toast('Already '+val,false); mutate((TITLE[k]||'Task')+' is now '+val, ()=>{ setPrio(k,val); FLASH=k; }); }
    else if(type==='own'){ mutate(val+' added to '+(TITLE[k]||'task'), ()=>{ addOwner(k,val); FLASH=k; }); }
  }
}
function swReset(row){ if(!row) return; const inner=row.querySelector('.sh'); inner.style.transform=''; row.classList.remove('sw-r','sw-l','sw-go','swon'); }
function swDown(e){
  if(e.pointerType==='mouse'||DRAG) return;
  const row=e.target.closest('.shw[data-k]:not([data-dn])'); if(!row||e.target.closest('input,.hd')) return;
  SW={row,x:e.clientX,y:e.clientY,dx:0,lock:null,id:e.pointerId};
}
function swMove(e){
  if(!SW||e.pointerId!==SW.id) return;
  const dx=e.clientX-SW.x, dy=e.clientY-SW.y;
  if(!SW.lock){ if(Math.abs(dx)>10 && Math.abs(dx)>1.5*Math.abs(dy)){ SW.lock='h'; SW.row.classList.add('swon'); } else { if(Math.abs(dy)>10) SW=null; return; } }
  SW.dx=dx; SW.row.querySelector('.sh').style.transform='translateX('+dx+'px)';
  SW.row.classList.toggle('sw-r',dx>0); SW.row.classList.toggle('sw-l',dx<0); SW.row.classList.toggle('sw-go',Math.abs(dx)>=90);
}
function swUp(){
  if(!SW) return; const {row,dx,lock}=SW; SW=null; if(lock!=='h') return;
  SWIPED=Date.now(); const k=row.dataset.k, r=row.getBoundingClientRect();
  if(dx>=90) mutate('Marked done',()=>{ L.tdone[k]=true; },{x:r.left+r.width/2,y:r.top+r.height/2});
  else if(dx<=-90) mutate('Check-up moved +1 day',()=>{ const cur=EFF[k], t=todayNY(); L.snooze[k]=addDays((cur&&cur>t)?cur:t,1); FLASH=k; });
  else swReset(row);
}
function initSheet(){
  const live = ()=>CUR && STATE.view==='sheet';
  document.addEventListener('pointerdown',e=>{
    if(!live()) return;
    const hd=e.target.closest('[data-hd]');
    if(hd){ const row=hd.closest('.shw'); startDrag(e,'row',row.dataset.k,(row.querySelector('.tt')||{}).textContent||'Task',row); return; }
    const tc=e.target.closest('[data-tc]'); if(tc){ startDrag(e,'chip',tc.dataset.tc,tc.textContent.trim(),null); return; }
    swDown(e);
  });
  document.addEventListener('pointermove',e=>{ if(DRAG) dragMove(e); else swMove(e); });
  document.addEventListener('pointerup',()=>{ if(DRAG) dragDrop(); else swUp(); });
  document.addEventListener('pointercancel',()=>{ if(DRAG) endDrag(); else if(SW){ swReset(SW.row); SW=null; } });
  document.addEventListener('click',e=>{ if(Date.now()-SWIPED<500){ e.stopPropagation(); e.preventDefault(); } },true);
  document.addEventListener('click',e=>{
    if(!live()) return;
    const pr=e.target.closest('[data-pr]');
    if(pr){ const k=pr.dataset.pr, cur=SHEET.prioOf[k]||'Low', nx={Top:'Medium',Medium:'Low',Low:'Top'}[cur]; mutate((TITLE[k]||'Task')+' is now '+nx,()=>{ setPrio(k,nx); FLASH=k; }); return; }
    const db=e.target.closest('[data-dueb]');
    if(db){ const inp=db.parentNode.querySelector('.dpick'); if(inp){ try{ inp.showPicker(); }catch(x){ inp.focus(); inp.click(); } } return; }
    const rm=e.target.closest('[data-rmnew]');
    if(rm){ const id=rm.dataset.rmnew, k='n:'+id; mutate('Task removed',()=>{ L.newTasks=L.newTasks.filter(n=>n.id!==id); delete L.prio[k]; delete L.own[k]; delete L.tdone[k]; delete L.snooze[k]; L.order=L.order.filter(x=>x!==k); }); }
  });
  document.addEventListener('change',e=>{
    if(!live()) return;
    const ck=e.target.closest&&e.target.closest('[data-ck]');
    if(ck){ const k=ck.dataset.ck, r=ck.getBoundingClientRect();
      if(ck.checked) mutate('Marked done',()=>{ L.tdone[k]=true; },{x:r.left+r.width/2,y:r.top+r.height/2});
      else mutate('Reopened',()=>{ delete L.tdone[k]; }); return; }
    const du=e.target.closest&&e.target.closest('[data-due]');
    if(du){ const k=du.dataset.due, v=du.value; if(v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
      mutate(v?'Check-up set to '+fmtDay(v):'Check-up date cleared',()=>{ if(v) L.snooze[k]=v; else delete L.snooze[k]; FLASH=k; }); }
  });
  document.addEventListener('keydown',e=>{
    if(!live()) return;
    const tag=(e.target.tagName||'').toLowerCase();
    if(e.key==='Escape' && DRAG){ endDrag(); return; }
    if((e.metaKey||e.ctrlKey) && !e.shiftKey && (e.key==='z'||e.key==='Z') && tag!=='input' && tag!=='textarea'){ e.preventDefault(); undo(); return; }
    if(e.target.id==='quick' && e.key==='Enter'){
      const v=e.target.value.trim().slice(0,120); if(!v) return; e.preventDefault();
      FOCUSQ=true; const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      mutate('Task added',()=>{ L.newTasks.push({id,task:v,priority:'Medium',owner:[CUR.me]}); FLASH='n:'+id; }); return; }
    const hd=e.target.closest&&e.target.closest('[data-hd]');
    if(hd && e.altKey && (e.key==='ArrowUp'||e.key==='ArrowDown')){
      e.preventDefault(); const k=hd.closest('.shw').dataset.k;
      const flat=[].concat(SHEET.groups.Top,SHEET.groups.Medium,SHEET.groups.Low), i=flat.indexOf(k); if(i<0) return;
      let p,before;
      if(e.key==='ArrowUp'){ if(i===0) return; before=flat[i-1]; p=SHEET.prioOf[before]; }
      else { const nx=flat[i+1]; if(!nx) return; p=SHEET.prioOf[nx]; const nn=flat[i+2]; before=(nn&&SHEET.prioOf[nn]===p)?nn:null; }
      FOCUSK=k; mutate('Moved',()=>moveTask(k,p,before));
    }
  });
}
initSheet();

async function tryOpen(code, remember){
  const res = await unlock(code);
  if(!res) return false;
  if(remember){ try{localStorage.setItem('bsg_code', code)}catch(e){} }
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='block';
  const D0 = normalize(res.data);
  CUR = {D:D0, me:res.name};
  const ow = [...new Set(D0.tasks.concat(D0.clients).flatMap(r=>r.owner))];
  if(ow.includes(res.name)) STATE.owner = res.name;
  shell(D0, res.name);
  renderMain();
  return true;
}

try{ const t=localStorage.getItem('bsg_theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
document.getElementById('lockform').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'), err=document.getElementById('err');
  btn.textContent='Unlocking…'; btn.disabled=true; err.textContent='';
  const ok = await tryOpen(document.getElementById('code').value, document.getElementById('remember').checked);
  if(!ok){ err.textContent='That code did not work.'; btn.textContent='Unlock'; btn.disabled=false; }
});
(async()=>{ let c=null; try{c=localStorage.getItem('bsg_code')}catch(e){} if(c && !(await tryOpen(c,false))){ try{localStorage.removeItem('bsg_code')}catch(e){} } })();
</script>
